name: Tag frontend version

on:
  push:
    branches: [main]
    paths: [versions/frontend/VERSION.md]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-version-tag
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.repository == 'Azouriss/MyBudget' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Fetch the exact public commit
        # Public checkout needs no credentials or third-party action.
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Test tag safeguards
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Create version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/tag_frontend.py
